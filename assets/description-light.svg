<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" fill="none">
<style>
  .line {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 21px;
    font-weight: 400;
    line-height: 1.5;
    letter-spacing: -0.2px;
  }
  .plain { fill: #1f2328; }
  
  /* Indian Flag Tricolor */
  .ind-s { fill: #ff9933; text-decoration: underline; text-decoration-color: #ff9933; text-underline-offset: 6px; text-decoration-thickness: 3.5px; }
  .ind-w { fill: #ff9933; text-decoration: underline; text-decoration-color: #57606a; text-underline-offset: 6px; text-decoration-thickness: 3.5px; }
  .ind-g { fill: #22c55e; text-decoration: underline; text-decoration-color: #22c55e; text-underline-offset: 6px; text-decoration-thickness: 3.5px; }
  
  /* Tech Underlines & Text Highlights */
  .python { fill: #fbbf24; text-decoration: underline; text-decoration-color: #fbbf24; text-underline-offset: 6px; text-decoration-thickness: 3.5px; }
  .cpp { fill: #4f8cff; text-decoration: underline; text-decoration-color: #4f8cff; text-underline-offset: 6px; text-decoration-thickness: 3.5px; }
  .azure { fill: #0089d6; text-decoration: underline; text-decoration-color: #0089d6; text-underline-offset: 6px; text-decoration-thickness: 3.5px; }
  .docker { fill: #2496ed; text-decoration: underline; text-decoration-color: #2496ed; text-underline-offset: 6px; text-decoration-thickness: 3.5px; }
  .micro { fill: #22c55e; text-decoration: underline; text-decoration-color: #22c55e; text-underline-offset: 6px; text-decoration-thickness: 3.5px; }
  .oss { fill: #c084fc; text-decoration: underline; text-decoration-color: #c084fc; text-underline-offset: 6px; text-decoration-thickness: 3.5px; }
  .stars { fill: #fbbf24; text-decoration: underline; text-decoration-color: #fbbf24; text-underline-offset: 6px; text-decoration-thickness: 3.5px; }
</style>

<!-- Paragraph 1 -->
<text x="32" y="44" class="line">
  <tspan class="plain">Hello, I am a 21-year-old CSE student from </tspan><tspan class="ind-s">In</tspan><tspan class="ind-w">d</tspan><tspan class="ind-g">ia</tspan><tspan class="plain">.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="32" y="102" class="line">
  <tspan class="plain">I have good knowledge of </tspan><tspan class="python">Python</tspan><tspan class="plain"> and have done DSA in </tspan><tspan class="cpp">C++</tspan><tspan class="plain">. I</tspan>
</text>

<text x="32" y="142" class="line">
  <tspan class="plain">also know </tspan><tspan class="azure">Azure</tspan><tspan class="plain"> and </tspan><tspan class="docker">Docker</tspan><tspan class="plain">. I have hands-on experience with</tspan>
</text>

<text x="32" y="182" class="line">
  <tspan class="plain">microcontrollers like </tspan><tspan class="micro">ESP32</tspan><tspan class="plain"> and </tspan><tspan class="micro">ATmega328P</tspan><tspan class="plain">.</tspan>
</text>

<!-- Paragraph 3 -->
<text x="32" y="240" class="line">
  <tspan class="plain">I have a </tspan><tspan class="oss">open source project</tspan><tspan class="plain"> with </tspan><tspan class="stars">120+ Stars</tspan><tspan class="plain">, along with that I am</tspan>
</text>

<text x="32" y="280" class="line">
  <tspan class="azure">Azure Certified</tspan><tspan class="plain">.</tspan>
</text>

</svg>