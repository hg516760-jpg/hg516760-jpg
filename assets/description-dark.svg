<!-- Top Horizontal Divider matching the reference line -->
<line x1="84" y1="6" x2="940" y2="6" stroke="#21262d" stroke-width="1" />

<!-- Line 1: Centered -->
<text x="510" y="31" class="line-center">Hello, I am a 21-year-old CSE student from India.</text>

<!-- Paragraph 2: Block width 501px (from x=259 to x=760) -->
<text x="259" y="71" class="line-justified" textLength="501" lengthAdjust="spacing">I have good knowledge of Python and have done DSA in C++. I also know Azure</text>
